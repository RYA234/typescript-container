<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phaser.js デモ - キャラクター管理</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0f172a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: #e2e8f0;
    }
    h1 {
      font-size: 1.4rem;
      margin-bottom: 6px;
      color: #a78bfa;
    }
    p.hint {
      font-size: 0.85rem;
      color: #64748b;
      margin-bottom: 12px;
    }
    #game-container canvas {
      border: 2px solid #334155;
      border-radius: 6px;
    }

    /* ── Phaser DOM UI スタイル ── */
    .list-panel, .detail-panel {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 10px;
      width: 230px;
      font-size: 13px;
      color: #e2e8f0;
    }
    .detail-panel { width: 490px; }

    .panel-title {
      font-size: 13px;
      font-weight: bold;
      color: #a78bfa;
      margin-bottom: 8px;
      border-bottom: 1px solid #334155;
      padding-bottom: 4px;
    }

    .char-card {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 4px;
      padding: 6px 8px;
      margin-bottom: 6px;
      cursor: pointer;
      transition: border-color 0.15s;
    }
    .char-card:hover { border-color: #a78bfa; }
    .char-card.selected { border-color: #a78bfa; background: #1e1b4b; }
    .char-name { font-weight: bold; font-size: 13px; }
    .char-status { font-size: 11px; color: #94a3b8; margin-top: 2px; }

    .btn-add {
      width: 100%;
      background: #1e293b;
      border: 1px dashed #475569;
      color: #94a3b8;
      padding: 6px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      margin-top: 4px;
    }
    .btn-add:hover { border-color: #a78bfa; color: #a78bfa; }

    .section-title {
      font-size: 11px;
      color: #64748b;
      margin: 8px 0 4px;
    }
    .stat-row { font-size: 12px; margin-bottom: 4px; }
    .bar-bg {
      background: #0f172a;
      border-radius: 3px;
      height: 6px;
      margin-top: 2px;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      border-radius: 3px;
      transition: width 0.3s;
    }

    .no-injury, .no-select { font-size: 12px; color: #475569; }
    .injury-row { font-size: 12px; color: #f87171; margin-bottom: 2px; }

    .action-buttons {
      display: flex;
      gap: 6px;
      margin-top: 4px;
    }
    .btn-action {
      flex: 1;
      background: #0f172a;
      border: 1px solid #334155;
      color: #94a3b8;
      padding: 5px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
    }
    .btn-action:hover { border-color: #a78bfa; color: #a78bfa; }
    .btn-action.active { background: #1e1b4b; border-color: #a78bfa; color: #a78bfa; }

    .turn-text {
      font-size: 13px;
      color: #94a3b8;
      text-align: right;
    }
    .btn-turn {
      background: #4f46e5;
      border: none;
      color: #fff;
      padding: 6px 14px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
    }
    .btn-turn:hover { background: #6366f1; }

    /* モーダル */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .modal-box {
      background: #1e293b;
      border: 1px solid #475569;
      border-radius: 8px;
      padding: 20px;
      width: 300px;
    }
    .modal-title {
      font-weight: bold;
      color: #a78bfa;
      margin-bottom: 14px;
      font-size: 14px;
    }
    .modal-row {
      margin-bottom: 10px;
      font-size: 13px;
    }
    .modal-row label {
      display: block;
      color: #94a3b8;
      margin-bottom: 4px;
    }
    .modal-row input, .modal-row select {
      width: 100%;
      background: #0f172a;
      border: 1px solid #334155;
      color: #e2e8f0;
      padding: 6px 8px;
      border-radius: 4px;
      font-size: 13px;
    }
    .modal-buttons {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      margin-top: 14px;
    }
    .modal-buttons button {
      padding: 6px 14px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #e2e8f0;
    }
    .modal-buttons button:last-child {
      background: #4f46e5;
      border-color: #4f46e5;
      color: #fff;
    }
    .modal-buttons button:last-child:hover { background: #6366f1; }
  </style>
</head>
<body>
  <h1>Phaser.js デモ - キャラクター管理</h1>
  <p class="hint">キャラクターを選択してアクションを設定 → ターン進行でステータスが変化します</p>
  <div id="game-container"></div>
  <script src="character-management.js"></script>
</body>
</html>
