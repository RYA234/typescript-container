<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phaser.js デモ - タイルマップ</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #1a1a2e;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: #eee;
    }
    h1 {
      font-size: 1.6rem;
      margin-bottom: 8px;
      color: #a78bfa;
    }
    p.hint {
      font-size: 0.95rem;
      color: #888;
      margin-bottom: 16px;
    }
    #game-container canvas {
      border: 3px solid #a78bfa;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <h1>Phaser.js デモ - タイルマップ</h1>
  <p class="hint">マップ上をクリックするとキャラクターが移動します</p>
  <div id="game-container"></div>
  <script src="game.js"></script>
</body>
</html>
