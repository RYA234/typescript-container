<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDFドキュメント取り込み - RAGデモ</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #b71c1c 0%, #1a237e 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .page-header { text-align: center; color: white; margin-bottom: 24px; }
    .page-header h1 { font-size: 1.8rem; margin-bottom: 6px; }
    .page-header p { opacity: 0.85; font-size: 0.95rem; }

    .header-links { display: flex; gap: 8px; margin-bottom: 16px; align-items: center; }

    .back-link {
      display: inline-block; color: white; text-decoration: none;
      padding: 6px 14px; border: 1px solid white; border-radius: 6px;
      font-size: 0.85rem; transition: all 0.2s;
    }
    .back-link:hover { background: white; color: #b71c1c; }

    .gh-link {
      display: inline-flex; align-items: center; gap: 5px; color: white;
      text-decoration: none; padding: 6px 14px; border: 1px solid rgba(255,255,255,0.6);
      border-radius: 6px; font-size: 0.85rem; transition: all 0.2s; opacity: 0.85;
    }
    .gh-link:hover { background: white; color: #b71c1c; opacity: 1; }

    .card {
      background: white; border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.12);
      padding: 20px; max-width: 800px; margin: 0 auto 16px;
    }

    .card h2 { font-size: 1rem; font-weight: 700; color: #b71c1c; margin-bottom: 14px; }

    label { display: block; font-size: 0.85rem; font-weight: 600; color: #555; margin-bottom: 6px; }

    input[type="text"] {
      width: 100%; padding: 10px 12px; border: 2px solid #ddd;
      border-radius: 8px; font-size: 0.9rem; outline: none;
      font-family: inherit; transition: border-color 0.2s;
    }
    input:focus { border-color: #b71c1c; }

    .drop-zone {
      border: 2px dashed #ddd; border-radius: 8px; padding: 32px 20px;
      text-align: center; cursor: pointer; transition: all 0.2s; margin-bottom: 14px;
      color: #888;
    }
    .drop-zone:hover, .drop-zone.drag-over { border-color: #b71c1c; background: #fff5f5; color: #b71c1c; }
    .drop-zone .drop-icon { font-size: 2rem; margin-bottom: 8px; }
    .drop-zone input[type="file"] { display: none; }

    .file-preview {
      display: flex; align-items: center; gap: 10px; padding: 10px 14px;
      background: #fff5f5; border-radius: 8px; margin-bottom: 14px;
    }
    .file-preview .file-icon { font-size: 1.4rem; }
    .file-preview .file-info { flex: 1; font-size: 0.85rem; }
    .file-preview .file-name { font-weight: 600; color: #333; }
    .file-preview .file-size { color: #888; font-size: 0.8rem; }
    .file-preview .remove-btn { cursor: pointer; color: #e53935; font-size: 1.2rem; padding: 4px; }

    .form-group { margin-bottom: 14px; }

    .btn {
      padding: 10px 22px; border: none; border-radius: 8px;
      font-size: 0.9rem; font-weight: 600; cursor: pointer; transition: all 0.2s;
    }
    .btn-primary { background: #b71c1c; color: white; }
    .btn-primary:hover { background: #d32f2f; }
    .btn-primary:disabled { background: #90a4ae; cursor: not-allowed; }
    .btn-danger { background: #c62828; color: white; font-size: 0.8rem; padding: 6px 14px; }
    .btn-danger:hover { background: #d32f2f; }

    .pdf-list { margin-top: 14px; }
    .pdf-item {
      display: flex; align-items: center; gap: 10px; padding: 10px 12px;
      border: 1px solid #eee; border-radius: 8px; margin-bottom: 8px;
    }
    .pdf-item .pdf-icon { font-size: 1.4rem; }
    .pdf-item .pdf-info { flex: 1; }
    .pdf-item .pdf-title { font-weight: 600; font-size: 0.9rem; }
    .pdf-item .pdf-meta { font-size: 0.78rem; color: #888; }

    .query-row { display: flex; gap: 10px; align-items: flex-end; }
    .query-row .form-group { flex: 1; }

    .result-box {
      margin-top: 14px; padding: 14px; border-radius: 8px; font-size: 0.9rem; line-height: 1.6;
    }
    .result-box.success { background: #ffebee; border-left: 4px solid #b71c1c; }
    .result-box.error { background: #ffebee; border-left: 4px solid #e53935; }
    .result-box.info { background: #e3f2fd; border-left: 4px solid #1565c0; }

    .source-item {
      font-size: 0.82rem; color: #555; margin-top: 6px;
      padding: 8px 10px; background: #f5f5f5; border-radius: 6px;
    }
    .page-badge {
      display: inline-block; padding: 1px 8px; border-radius: 10px;
      background: #ffcdd2; color: #b71c1c; font-size: 0.75rem; font-weight: 600; margin-right: 6px;
    }
    .meta { font-size: 0.8rem; color: #888; margin-top: 8px; }
    .hidden { display: none; }
  </style>
</head>
<body>

<div style="max-width:800px;margin:0 auto;">
  <div class="header-links">
    <a href="/node" class="back-link">← Back to Home</a>
    <a href="https://github.com/RYA234/typescript-container/issues/61" class="gh-link" target="_blank">GitHub #61</a>
  </div>

  <div class="page-header">
    <h1>PDFドキュメント取り込み</h1>
    <p>PDFをアップロードしてテキストを抽出・ベクトル化し、RAGで検索できます</p>
  </div>

  <!-- アップロードカード（開発環境のみ） -->
  <div class="card" id="uploadCard">
    <h2>📤 Step 1: PDFアップロード</h2>

    <div class="drop-zone" id="dropZone" onclick="document.getElementById('fileInput').click()">
      <div class="drop-icon">📄</div>
      <div>PDFファイルをここにドロップ、またはクリックして選択</div>
      <div style="font-size:0.78rem;margin-top:4px;">最大10MB・テキストベースPDFのみ対応</div>
      <input type="file" id="fileInput" accept=".pdf" onchange="onFileSelected(this.files[0])">
    </div>

    <div class="file-preview hidden" id="filePreview">
      <div class="file-icon">📄</div>
      <div class="file-info">
        <div class="file-name" id="fileName"></div>
        <div class="file-size" id="fileSize"></div>
      </div>
      <div class="remove-btn" onclick="clearFile()">✕</div>
    </div>

    <div class="form-group">
      <label>タイトル</label>
      <input type="text" id="titleInput" placeholder="例: 就業規則2026年版">
    </div>

    <div style="display:flex;gap:10px;align-items:center;">
      <button class="btn btn-primary" id="uploadBtn" onclick="doUpload()">アップロード</button>
      <button class="btn btn-danger" onclick="doDeleteAll()">全件削除</button>
    </div>
    <div id="uploadResult"></div>
  </div>

  <!-- PDF一覧カード -->
  <div class="card">
    <h2>📋 アップロード済みPDF</h2>
    <div id="pdfList"><div style="color:#888;font-size:0.9rem;">読み込み中...</div></div>
    <button class="btn btn-primary" onclick="loadList()" style="margin-top:10px;font-size:0.82rem;padding:6px 14px;">更新</button>
  </div>

  <!-- クエリカード -->
  <div class="card">
    <h2>🔍 Step 2: PDF内容に質問する</h2>
    <div class="query-row">
      <div class="form-group">
        <label>質問</label>
        <input type="text" id="queryInput" placeholder="例: 育児休業の取得条件は？">
      </div>
      <button class="btn btn-primary" onclick="doQuery()" style="margin-bottom:14px;">質問する</button>
    </div>
    <div id="queryResult"></div>
  </div>
</div>

<script>
  let selectedFile = null;

  async function checkConfig() {
    try {
      const res = await fetch('/node/rag/pdf/config');
      const data = await res.json();
      if (!data.writeEnabled) document.getElementById('uploadCard').classList.add('hidden');
    } catch {}
  }
  checkConfig();
  loadList();

  // ドラッグ＆ドロップ
  const dropZone = document.getElementById('dropZone');
  dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
  dropZone.addEventListener('drop', e => {
    e.preventDefault();
    dropZone.classList.remove('drag-over');
    if (e.dataTransfer.files[0]) onFileSelected(e.dataTransfer.files[0]);
  });

  function onFileSelected(file) {
    if (!file || file.type !== 'application/pdf') {
      alert('PDFファイルを選択してください');
      return;
    }
    selectedFile = file;
    document.getElementById('fileName').textContent = file.name;
    document.getElementById('fileSize').textContent = (file.size / 1024 / 1024).toFixed(2) + ' MB';
    document.getElementById('filePreview').classList.remove('hidden');
    if (!document.getElementById('titleInput').value) {
      document.getElementById('titleInput').value = file.name.replace('.pdf', '');
    }
  }

  function clearFile() {
    selectedFile = null;
    document.getElementById('fileInput').value = '';
    document.getElementById('filePreview').classList.add('hidden');
  }

  function escape(str) {
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  async function doUpload() {
    if (!selectedFile) { alert('PDFファイルを選択してください'); return; }
    const title = document.getElementById('titleInput').value.trim();
    if (!title) { alert('タイトルを入力してください'); return; }

    const resultEl = document.getElementById('uploadResult');
    const btn = document.getElementById('uploadBtn');
    btn.disabled = true;
    resultEl.innerHTML = '<div class="result-box info">アップロード・解析中... しばらくお待ちください</div>';

    const formData = new FormData();
    formData.append('file', selectedFile);
    formData.append('title', title);

    try {
      const res = await fetch('/node/rag/pdf/upload', { method: 'POST', body: formData });
      const data = await res.json();
      if (!res.ok) {
        resultEl.innerHTML = `<div class="result-box error">${escape(data.message)}</div>`;
      } else {
        resultEl.innerHTML = `<div class="result-box success">
          ✅ アップロード完了<br>
          タイトル: ${escape(data.title)} / ${data.pageCount}ページ / ${data.chunkCount}チャンク / ${data.executionTimeMs}ms
        </div>`;
        clearFile();
        document.getElementById('titleInput').value = '';
        loadList();
      }
    } catch {
      resultEl.innerHTML = '<div class="result-box error">通信エラーが発生しました</div>';
    } finally {
      btn.disabled = false;
    }
  }

  async function doDeleteAll() {
    if (!confirm('すべてのPDFを削除しますか？')) return;
    try {
      const res = await fetch('/node/rag/pdf/documents', { method: 'DELETE' });
      const data = await res.json();
      document.getElementById('uploadResult').innerHTML = `<div class="result-box info">${escape(data.message)}</div>`;
      loadList();
    } catch {
      alert('削除エラーが発生しました');
    }
  }

  async function loadList() {
    const listEl = document.getElementById('pdfList');
    try {
      const res = await fetch('/node/rag/pdf/list');
      const data = await res.json();
      if (data.pdfs.length === 0) {
        listEl.innerHTML = '<div style="color:#888;font-size:0.9rem;">まだPDFがアップロードされていません</div>';
      } else {
        listEl.innerHTML = data.pdfs.map(p => `
          <div class="pdf-item">
            <div class="pdf-icon">📄</div>
            <div class="pdf-info">
              <div class="pdf-title">${escape(p.title)}</div>
              <div class="pdf-meta">${escape(p.fileName)}${p.pageCount ? ' · ' + p.pageCount + 'ページ' : ''}</div>
            </div>
          </div>`).join('');
      }
    } catch {
      listEl.innerHTML = '<div style="color:#888;">一覧の取得に失敗しました</div>';
    }
  }

  async function doQuery() {
    const question = document.getElementById('queryInput').value.trim();
    const resultEl = document.getElementById('queryResult');
    if (!question) { resultEl.innerHTML = '<div class="result-box error">質問を入力してください</div>'; return; }

    resultEl.innerHTML = '<div class="result-box info">検索中...</div>';
    try {
      const res = await fetch('/node/rag/pdf/query', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question }),
      });
      const data = await res.json();
      if (!res.ok) {
        resultEl.innerHTML = `<div class="result-box error">${escape(data.message)}</div>`;
      } else {
        const sourcesHtml = data.sources.length > 0
          ? `<div style="margin-top:12px;"><strong style="font-size:0.82rem;color:#555;">参照元 (${data.sources.length}件)</strong>
              ${data.sources.map(s => `
                <div class="source-item">
                  <span class="page-badge">p.${s.page}</span>${escape(s.title)} | 類似度: ${(s.similarity*100).toFixed(1)}%
                  <br>${escape(s.content.substring(0,120))}...
                </div>`).join('')}
            </div>` : '';
        resultEl.innerHTML = `<div class="result-box success">
          ${escape(data.answer).replace(/\n/g,'<br>')}
          ${sourcesHtml}
          <div class="meta">処理時間: ${data.executionTimeMs}ms</div>
        </div>`;
      }
    } catch {
      resultEl.innerHTML = '<div class="result-box error">通信エラーが発生しました</div>';
    }
  }

  document.getElementById('queryInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') doQuery();
  });
</script>
</body>
</html>
