<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>就業規則Q&A - RAGデモ</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .page-header {
      text-align: center;
      color: white;
      margin-bottom: 24px;
    }

    .page-header h1 { font-size: 1.8rem; margin-bottom: 6px; }
    .page-header p { opacity: 0.85; font-size: 0.95rem; }

    .back-link {
      display: inline-block;
      color: white;
      text-decoration: none;
      padding: 6px 14px;
      border: 1px solid white;
      border-radius: 6px;
      font-size: 0.85rem;
      margin-bottom: 16px;
      transition: all 0.2s;
    }
    .back-link:hover { background: white; color: #11998e; }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: auto auto;
      gap: 16px;
    }

    .grid.readonly {
      grid-template-columns: 1fr;
      max-width: 1100px;
      margin: 0 auto;
    }

    .card {
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.12);
      padding: 20px;
    }

    .card-full { grid-column: 1 / -1; }

    .card h2 {
      font-size: 1rem;
      font-weight: 700;
      color: #11998e;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .step-badge {
      background: #11998e;
      color: white;
      border-radius: 50%;
      width: 22px;
      height: 22px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      flex-shrink: 0;
    }

    textarea, input[type="text"] {
      width: 100%;
      padding: 10px 12px;
      border: 2px solid #ddd;
      border-radius: 8px;
      font-size: 0.9rem;
      outline: none;
      font-family: inherit;
      transition: border-color 0.2s;
    }
    textarea:focus, input[type="text"]:focus { border-color: #11998e; }

    textarea { resize: vertical; }

    .row { display: flex; gap: 8px; margin-top: 8px; align-items: center; }

    .label { font-size: 0.8rem; color: #666; margin-bottom: 4px; }

    button {
      padding: 10px 20px;
      background: #11998e;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.2s;
    }
    button:hover:not(:disabled) { background: #0d7a72; }
    button:disabled { background: #ccc; cursor: not-allowed; }

    button.danger { background: #e53935; }
    button.danger:hover:not(:disabled) { background: #c62828; }

    .result-box {
      margin-top: 12px;
      padding: 12px;
      background: #f5f5f5;
      border-radius: 8px;
      font-size: 0.85rem;
      min-height: 60px;
      white-space: pre-wrap;
      word-break: break-word;
      color: #333;
    }

    .result-box.empty { color: #999; font-style: italic; }
    .result-box.error { background: #fdecea; color: #c62828; }
    .result-box.success { background: #e8f5e9; color: #2e7d32; }

    .chunk-info {
      font-size: 0.8rem;
      color: #666;
      margin-top: 6px;
    }

    .search-results { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }

    .search-item {
      padding: 10px 12px;
      background: #f9f9f9;
      border-left: 3px solid #11998e;
      border-radius: 0 6px 6px 0;
      font-size: 0.85rem;
    }

    .search-item .sim {
      font-weight: 700;
      color: #11998e;
      margin-bottom: 4px;
    }

    .search-item .content { color: #333; line-height: 1.5; }
    .search-item .meta { font-size: 0.75rem; color: #999; margin-top: 4px; }

    .answer-box {
      margin-top: 12px;
      padding: 14px;
      background: #e8f5e9;
      border-radius: 8px;
      font-size: 0.9rem;
      line-height: 1.7;
      color: #1b5e20;
      display: none;
    }

    .answer-sources {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid #c8e6c9;
      font-size: 0.78rem;
      color: #388e3c;
    }

    .loading { color: #11998e; font-style: italic; }

    .stat-row {
      display: flex;
      gap: 12px;
      margin-top: 8px;
      flex-wrap: wrap;
    }

    .stat {
      background: #e0f7fa;
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 0.8rem;
      color: #00695c;
    }
  </style>
</head>
<body>
  <div style="max-width:1100px; margin:0 auto;">
    <a href="/node" class="back-link">← Back to Home</a>

    <div class="page-header">
      <h1>就業規則Q&A</h1>
      <p>RAGデモ — Gemini AI × Supabase pgvector</p>
    </div>

    <div class="grid" id="grid">

      <!-- Step 1: Ingest -->
      <div class="card" id="ingestCard">
        <h2><span class="step-badge">1</span> ドキュメント登録</h2>
        <div class="label">テキスト</div>
        <textarea id="ingestText" rows="6" placeholder="就業規則・社内規定などを入力してください..."></textarea>
        <div class="row">
          <input type="text" id="ingestSource" placeholder="出所ラベル（例: 就業規則）" style="flex:1;">
          <button id="ingestBtn">登録する</button>
        </div>
        <div id="ingestResult" class="result-box empty">登録結果がここに表示されます</div>
        <div class="row" style="margin-top:12px; justify-content:flex-end;">
          <button class="danger" id="deleteBtn">全削除</button>
        </div>
      </div>

      <!-- Step 2: Search -->
      <div class="card">
        <h2><span class="step-badge">2</span> 類似検索テスト</h2>
        <div class="label">検索ワード</div>
        <div class="row" style="margin-top:0;">
          <input type="text" id="searchQuery" placeholder="例: 有給休暇" style="flex:1;">
          <button id="searchBtn">検索</button>
        </div>
        <div id="searchResults" class="search-results">
          <div class="result-box empty">検索結果がここに表示されます</div>
        </div>
      </div>

      <!-- Step 3: Q&A -->
      <div class="card card-full">
        <h2><span class="step-badge">3</span> 質問応答（RAG）</h2>
        <div class="row" style="margin-top:0;">
          <input type="text" id="queryInput" placeholder="例: 有給は何日取れますか？" style="flex:1;">
          <button id="queryBtn">質問する</button>
        </div>
        <div id="answerBox" class="answer-box">
          <div id="answerText"></div>
          <div id="answerSources" class="answer-sources"></div>
        </div>
        <div id="queryLoading" style="display:none;" class="result-box loading">回答を生成中...</div>
        <div id="queryError" style="display:none;" class="result-box error"></div>
        <div id="queryStats" class="stat-row"></div>
      </div>

    </div>
  </div>

  <script>
    // --- Init: 本番環境では書き込み操作を非表示 ---
    (async () => {
      try {
        const res = await fetch('/node/rag/company-rules/config');
        const { writeEnabled } = await res.json();
        if (!writeEnabled) {
          document.getElementById('ingestCard').style.display = 'none';
          document.getElementById('grid').classList.add('readonly');
        }
      } catch (e) { /* 取得失敗時はそのまま表示 */ }
    })();

    // --- Ingest ---
    document.getElementById('ingestBtn').addEventListener('click', async () => {
      const text = document.getElementById('ingestText').value.trim();
      const source = document.getElementById('ingestSource').value.trim() || 'unknown';
      const resultBox = document.getElementById('ingestResult');
      if (!text) { resultBox.className = 'result-box error'; resultBox.textContent = 'テキストを入力してください'; return; }

      const btn = document.getElementById('ingestBtn');
      btn.disabled = true;
      resultBox.className = 'result-box loading';
      resultBox.textContent = '登録中...';

      try {
        const res = await fetch('/node/rag/company-rules/ingest', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text, source }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.message || res.statusText);
        resultBox.className = 'result-box success';
        resultBox.textContent = `✓ ${data.message}\n処理時間: ${data.executionTimeMs}ms`;
      } catch (e) {
        resultBox.className = 'result-box error';
        resultBox.textContent = `エラー: ${e.message}`;
      } finally {
        btn.disabled = false;
      }
    });

    // --- Delete ---
    document.getElementById('deleteBtn').addEventListener('click', async () => {
      if (!confirm('全ドキュメントを削除しますか？')) return;
      const resultBox = document.getElementById('ingestResult');
      try {
        const res = await fetch('/node/rag/company-rules/documents', { method: 'DELETE' });
        const data = await res.json();
        resultBox.className = 'result-box success';
        resultBox.textContent = `✓ ${data.message}`;
      } catch (e) {
        resultBox.className = 'result-box error';
        resultBox.textContent = `エラー: ${e.message}`;
      }
    });

    // --- Search ---
    document.getElementById('searchBtn').addEventListener('click', async () => {
      const q = document.getElementById('searchQuery').value.trim();
      const container = document.getElementById('searchResults');
      if (!q) { container.innerHTML = '<div class="result-box error">検索ワードを入力してください</div>'; return; }

      const btn = document.getElementById('searchBtn');
      btn.disabled = true;
      container.innerHTML = '<div class="result-box loading">検索中...</div>';

      try {
        const res = await fetch(`/node/rag/company-rules/search?q=${encodeURIComponent(q)}&limit=3`);
        const data = await res.json();
        if (!res.ok) throw new Error(data.message || res.statusText);
        if (data.results.length === 0) {
          container.innerHTML = '<div class="result-box empty">該当する結果が見つかりませんでした</div>';
        } else {
          container.innerHTML = data.results.map(r => `
            <div class="search-item">
              <div class="sim">類似度 ${(r.similarity * 100).toFixed(1)}%</div>
              <div class="content">${escHtml(r.content.slice(0, 150))}${r.content.length > 150 ? '…' : ''}</div>
              <div class="meta">出所: ${escHtml(r.metadata.source)} | チャンク ${r.metadata.chunkIndex + 1}/${r.metadata.totalChunks}</div>
            </div>
          `).join('') + `<div class="chunk-info">処理時間: ${data.executionTimeMs}ms</div>`;
        }
      } catch (e) {
        container.innerHTML = `<div class="result-box error">エラー: ${escHtml(e.message)}</div>`;
      } finally {
        btn.disabled = false;
      }
    });

    // Enter key for search
    document.getElementById('searchQuery').addEventListener('keypress', e => {
      if (e.key === 'Enter') document.getElementById('searchBtn').click();
    });

    // --- Query ---
    document.getElementById('queryBtn').addEventListener('click', async () => {
      const question = document.getElementById('queryInput').value.trim();
      const answerBox = document.getElementById('answerBox');
      const answerText = document.getElementById('answerText');
      const answerSources = document.getElementById('answerSources');
      const loading = document.getElementById('queryLoading');
      const errorBox = document.getElementById('queryError');
      const statsBox = document.getElementById('queryStats');

      if (!question) return;

      const btn = document.getElementById('queryBtn');
      btn.disabled = true;
      answerBox.style.display = 'none';
      errorBox.style.display = 'none';
      statsBox.innerHTML = '';
      loading.style.display = 'block';

      try {
        const res = await fetch('/node/rag/company-rules/query', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ question }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.message || res.statusText);

        answerText.textContent = data.answer;
        answerSources.innerHTML = '参照元: ' + data.sources.map(s =>
          `${escHtml(s.metadata.source)} (類似度 ${(s.similarity * 100).toFixed(1)}%)`
        ).join(' | ');
        answerBox.style.display = 'block';
        statsBox.innerHTML = `<span class="stat">処理時間: ${data.executionTimeMs}ms</span><span class="stat">参照チャンク: ${data.sources.length}件</span>`;
      } catch (e) {
        errorBox.textContent = `エラー: ${e.message}`;
        errorBox.style.display = 'block';
      } finally {
        btn.disabled = false;
        loading.style.display = 'none';
      }
    });

    document.getElementById('queryInput').addEventListener('keypress', e => {
      if (e.key === 'Enter') document.getElementById('queryBtn').click();
    });

    function escHtml(str) {
      return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }
  </script>
</body>
</html>
