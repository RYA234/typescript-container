<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ハイブリッド検索 - RAGデモ</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #1a237e 0%, #283593 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .page-header { text-align: center; color: white; margin-bottom: 24px; }
    .page-header h1 { font-size: 1.8rem; margin-bottom: 6px; }
    .page-header p { opacity: 0.85; font-size: 0.95rem; }

    .header-links { display: flex; gap: 8px; margin-bottom: 16px; align-items: center; }

    .back-link {
      display: inline-block; color: white; text-decoration: none;
      padding: 6px 14px; border: 1px solid white; border-radius: 6px;
      font-size: 0.85rem; transition: all 0.2s;
    }
    .back-link:hover { background: white; color: #1a237e; }

    .gh-link {
      display: inline-flex; align-items: center; gap: 5px; color: white;
      text-decoration: none; padding: 6px 14px; border: 1px solid rgba(255,255,255,0.6);
      border-radius: 6px; font-size: 0.85rem; opacity: 0.85; transition: all 0.2s;
    }
    .gh-link:hover { background: white; color: #1a237e; opacity: 1; }

    .container { max-width: 820px; margin: 0 auto; }

    .card {
      background: white; border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.2);
      padding: 20px; margin-bottom: 16px;
    }
    .card h2 { font-size: 1rem; font-weight: 700; color: #1a237e; margin-bottom: 14px; }

    label { display: block; font-size: 0.85rem; font-weight: 600; color: #555; margin-bottom: 5px; }

    input[type="text"], input[type="number"], textarea {
      width: 100%; padding: 10px 12px; border: 2px solid #ddd;
      border-radius: 8px; font-size: 0.9rem; outline: none;
      font-family: inherit; transition: border-color 0.2s;
    }
    input:focus, textarea:focus { border-color: #1a237e; }
    textarea { resize: vertical; min-height: 100px; }

    .form-group { margin-bottom: 12px; }
    .form-row { display: flex; gap: 10px; }
    .form-row .form-group { flex: 1; }

    .btn {
      padding: 10px 22px; border: none; border-radius: 8px;
      font-size: 0.9rem; font-weight: 600; cursor: pointer; transition: all 0.2s;
    }
    .btn-primary { background: #1a237e; color: white; }
    .btn-primary:hover { background: #283593; }
    .btn-primary:disabled { background: #90a4ae; cursor: not-allowed; }
    .btn-danger { background: #c62828; color: white; font-size: 0.8rem; padding: 6px 14px; }
    .btn-danger:hover { background: #d32f2f; }

    /* 検索モード選択 */
    .mode-group { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
    .mode-btn {
      padding: 8px 16px; border: 2px solid #ddd; border-radius: 8px;
      background: white; font-size: 0.85rem; font-weight: 600; cursor: pointer; color: #555;
      transition: all 0.2s;
    }
    .mode-btn.active { border-color: #1a237e; background: #1a237e; color: white; }

    /* 重みスライダー */
    .weight-row { display: flex; gap: 16px; align-items: center; margin-bottom: 14px; }
    .weight-item { flex: 1; }
    .weight-label { font-size: 0.82rem; font-weight: 600; color: #555; margin-bottom: 4px; display: flex; justify-content: space-between; }
    input[type="range"] { width: 100%; accent-color: #1a237e; }

    /* スコアバー */
    .score-bar-wrap { display: flex; align-items: center; gap: 8px; margin: 3px 0; }
    .score-bar-bg { flex: 1; height: 6px; background: #e0e0e0; border-radius: 3px; overflow: hidden; }
    .score-bar-fill { height: 100%; border-radius: 3px; }
    .fill-vector { background: #3f51b5; }
    .fill-keyword { background: #00897b; }
    .fill-hybrid { background: #7b1fa2; }
    .score-val { font-size: 0.78rem; font-weight: 700; min-width: 48px; text-align: right; }

    /* ソースアイテム */
    .source-item {
      padding: 12px 14px; border: 1px solid #e0e0e0; border-radius: 8px; margin-bottom: 8px;
    }
    .source-header { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    .source-rank {
      width: 24px; height: 24px; border-radius: 50%; background: #1a237e; color: white;
      font-size: 0.78rem; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .source-hybrid-score {
      font-size: 0.82rem; font-weight: 700; color: #7b1fa2;
    }
    .source-text { font-size: 0.83rem; color: #555; line-height: 1.5; margin-top: 8px; }

    .answer-box {
      padding: 14px; background: #f5f5f5; border-radius: 8px;
      font-size: 0.92rem; line-height: 1.7; margin-bottom: 14px;
    }

    .result-box {
      margin-top: 14px; padding: 14px; border-radius: 8px; font-size: 0.9rem;
    }
    .result-box.success { background: #e8f5e9; border-left: 4px solid #2e7d32; }
    .result-box.error { background: #ffebee; border-left: 4px solid #e53935; }
    .result-box.info { background: #e3f2fd; border-left: 4px solid #1565c0; }

    .badge {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 2px 8px; border-radius: 10px; font-size: 0.75rem; font-weight: 700;
    }
    .badge-vector { background: #e8eaf6; color: #3f51b5; }
    .badge-keyword { background: #e0f2f1; color: #00897b; }
    .badge-both { background: #f3e5f5; color: #7b1fa2; }

    .meta { font-size: 0.8rem; color: #888; margin-top: 10px; }
    .hidden { display: none; }
    .section-title { font-size: 0.88rem; font-weight: 700; color: #1a237e; margin-bottom: 10px; }
  </style>
</head>
<body>

<div class="container">
  <div class="header-links">
    <a href="/node" class="back-link">← Back to Home</a>
    <a href="https://github.com/RYA234/typescript-container/issues/66" class="gh-link" target="_blank">GitHub #66</a>
  </div>

  <div class="page-header">
    <h1>ハイブリッド検索</h1>
    <p>ベクトル検索（意味的類似度）とキーワード検索（全文一致）をRRFで統合し検索精度を向上させる</p>
  </div>

  <!-- 登録カード -->
  <div class="card hidden" id="ingestCard">
    <h2>📥 ドキュメント登録</h2>
    <div class="form-group">
      <label>テキスト</label>
      <textarea id="ingestText" placeholder="例: モデルXYZ-300の最大出力は500W、重量3.2kg、動作温度-10〜50℃。保証期間は2年間。"></textarea>
    </div>
    <div class="form-group">
      <label>ソース名（任意）</label>
      <input type="text" id="ingestSource" placeholder="例: product-spec">
    </div>
    <div style="display:flex;gap:10px;align-items:center;">
      <button class="btn btn-primary" id="ingestBtn" onclick="doIngest()">登録</button>
      <button class="btn btn-danger" onclick="doDeleteAll()">全件削除</button>
    </div>
    <div id="ingestResult"></div>
  </div>

  <!-- クエリカード -->
  <div class="card">
    <h2>🔍 ハイブリッド検索クエリ</h2>

    <div class="form-group">
      <label>検索モード</label>
      <div class="mode-group">
        <button class="mode-btn" id="mode-vector" onclick="setMode('vector')">🔵 ベクトルのみ</button>
        <button class="mode-btn" id="mode-keyword" onclick="setMode('keyword')">🟢 キーワードのみ</button>
        <button class="mode-btn active" id="mode-hybrid" onclick="setMode('hybrid')">🟣 ハイブリッド (RRF)</button>
      </div>
    </div>

    <div id="weightSection">
      <div class="weight-row">
        <div class="weight-item">
          <div class="weight-label">
            <span>ベクトル重み</span>
            <span id="vwLabel">0.5</span>
          </div>
          <input type="range" id="vectorWeight" min="0" max="1" step="0.1" value="0.5" oninput="updateWeights()">
        </div>
        <div class="weight-item">
          <div class="weight-label">
            <span>キーワード重み</span>
            <span id="kwLabel">0.5</span>
          </div>
          <input type="range" id="keywordWeight" min="0" max="1" step="0.1" value="0.5" oninput="updateWeights()">
        </div>
      </div>
    </div>

    <div class="form-group">
      <label>質問</label>
      <input type="text" id="questionInput" placeholder="例: モデルXYZ-300の仕様は？">
    </div>
    <button class="btn btn-primary" id="queryBtn" onclick="doQuery()">検索する</button>
    <div id="queryResult"></div>
  </div>
</div>

<script>
  let currentMode = 'hybrid';

  async function checkConfig() {
    try {
      const res = await fetch('/node/rag/hybrid/config');
      const data = await res.json();
      if (data.writeEnabled) document.getElementById('ingestCard').classList.remove('hidden');
    } catch {}
  }
  checkConfig();

  function setMode(mode) {
    currentMode = mode;
    ['vector','keyword','hybrid'].forEach(m => {
      document.getElementById('mode-' + m).classList.toggle('active', m === mode);
    });
    document.getElementById('weightSection').style.display = mode === 'hybrid' ? '' : 'none';
  }

  function updateWeights() {
    document.getElementById('vwLabel').textContent = parseFloat(document.getElementById('vectorWeight').value).toFixed(1);
    document.getElementById('kwLabel').textContent = parseFloat(document.getElementById('keywordWeight').value).toFixed(1);
  }

  function escape(str) {
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function scoreBar(label, value, colorClass) {
    if (value === null) return '';
    const pct = Math.min(value * 100 * 15, 100).toFixed(0);
    return `
      <div class="score-bar-wrap">
        <span style="font-size:0.75rem;color:#777;width:68px;flex-shrink:0;">${label}</span>
        <div class="score-bar-bg"><div class="score-bar-fill ${colorClass}" style="width:${pct}%"></div></div>
        <span class="score-val" style="color:${colorClass==='fill-vector'?'#3f51b5':colorClass==='fill-keyword'?'#00897b':'#7b1fa2'}">${value.toFixed(4)}</span>
      </div>`;
  }

  function sourceBadge(s) {
    const hasV = s.vectorScore !== null;
    const hasK = s.keywordScore !== null;
    if (hasV && hasK) return '<span class="badge badge-both">🟣 両方ヒット</span>';
    if (hasV) return '<span class="badge badge-vector">🔵 ベクトルのみ</span>';
    return '<span class="badge badge-keyword">🟢 キーワードのみ</span>';
  }

  async function doIngest() {
    const text = document.getElementById('ingestText').value.trim();
    const source = document.getElementById('ingestSource').value.trim() || undefined;
    const resultEl = document.getElementById('ingestResult');
    const btn = document.getElementById('ingestBtn');
    if (!text) { resultEl.innerHTML = '<div class="result-box error">テキストを入力してください</div>'; return; }
    btn.disabled = true;
    resultEl.innerHTML = '<div class="result-box info">登録中...</div>';
    try {
      const res = await fetch('/node/rag/hybrid/ingest', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text, source }),
      });
      const data = await res.json();
      if (!res.ok) { resultEl.innerHTML = `<div class="result-box error">${escape(data.message)}</div>`; }
      else {
        resultEl.innerHTML = `<div class="result-box success">✅ 登録完了 ${data.chunkCount}チャンク / ${data.executionTimeMs}ms</div>`;
        document.getElementById('ingestText').value = '';
      }
    } catch { resultEl.innerHTML = '<div class="result-box error">通信エラー</div>'; }
    finally { btn.disabled = false; }
  }

  async function doDeleteAll() {
    if (!confirm('すべてのドキュメントを削除しますか？')) return;
    try {
      const res = await fetch('/node/rag/hybrid/documents', { method: 'DELETE' });
      const data = await res.json();
      document.getElementById('ingestResult').innerHTML = `<div class="result-box info">${escape(data.message)}</div>`;
    } catch { alert('削除エラー'); }
  }

  async function doQuery() {
    const question = document.getElementById('questionInput').value.trim();
    const vectorWeight = parseFloat(document.getElementById('vectorWeight').value);
    const keywordWeight = parseFloat(document.getElementById('keywordWeight').value);
    const resultEl = document.getElementById('queryResult');
    const btn = document.getElementById('queryBtn');
    if (!question) { resultEl.innerHTML = '<div class="result-box error">質問を入力してください</div>'; return; }

    btn.disabled = true;
    resultEl.innerHTML = '<div class="result-box info">検索・回答生成中...</div>';

    try {
      const res = await fetch('/node/rag/hybrid/query', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question, searchMode: currentMode, vectorWeight, keywordWeight }),
      });
      const data = await res.json();
      if (!res.ok) { resultEl.innerHTML = `<div class="result-box error">${escape(data.message)}</div>`; return; }

      const modeLabel = { vector: '🔵 ベクトルのみ', keyword: '🟢 キーワードのみ', hybrid: '🟣 ハイブリッド (RRF)' }[data.searchMode];

      const sourcesHtml = data.sources.length > 0
        ? data.sources.map((s, i) => `
            <div class="source-item">
              <div class="source-header">
                <div class="source-rank">${i+1}</div>
                ${sourceBadge(s)}
                <span class="source-hybrid-score">統合スコア: ${s.hybridScore.toFixed(4)}</span>
              </div>
              ${scoreBar('ベクトル', s.vectorScore, 'fill-vector')}
              ${scoreBar('キーワード', s.keywordScore, 'fill-keyword')}
              <div class="source-text">${escape(s.content.substring(0, 150))}${s.content.length > 150 ? '...' : ''}</div>
            </div>`).join('')
        : '<div style="color:#888;font-size:0.88rem;">参照ソースが見つかりませんでした</div>';

      resultEl.innerHTML = `
        <div style="margin-top:14px;">
          <div style="font-size:0.82rem;color:#888;margin-bottom:10px;">検索モード: ${modeLabel}</div>
          <div class="section-title">回答</div>
          <div class="answer-box">${escape(data.answer).replace(/\n/g,'<br>')}</div>
          <div class="section-title">検索結果 (${data.sources.length}件)</div>
          ${sourcesHtml}
          <div class="meta">処理時間: ${data.executionTimeMs}ms</div>
        </div>`;
    } catch { resultEl.innerHTML = '<div class="result-box error">通信エラー</div>'; }
    finally { btn.disabled = false; }
  }

  document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('questionInput').addEventListener('keydown', e => {
      if (e.key === 'Enter') doQuery();
    });
  });
</script>
</body>
</html>
