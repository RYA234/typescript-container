<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RAG + エージェント連携</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      line-height: 1.6;
      color: #333;
      background: linear-gradient(135deg, #004d40 0%, #00796b 100%);
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      background: white;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
      max-width: 800px;
      margin: 0 auto;
      padding: 40px;
    }
    .header-links { display: flex; gap: 12px; margin-bottom: 24px; flex-wrap: wrap; }
    .header-links a {
      font-size: 0.85rem; color: #004d40; text-decoration: none;
      padding: 4px 10px; border: 1px solid #004d40; border-radius: 4px;
    }
    .header-links a:hover { background: #004d40; color: white; }
    h1 { color: #004d40; font-size: 2rem; margin-bottom: 8px; }
    .subtitle { color: #666; margin-bottom: 24px; }
    .docs-list { background: #e0f2f1; border-radius: 8px; padding: 16px; margin-bottom: 24px; }
    .docs-list h3 { font-size: 0.85rem; color: #004d40; margin-bottom: 8px; }
    .docs-list ul { list-style: none; }
    .docs-list li { font-size: 0.9rem; color: #555; padding: 3px 0; }
    .docs-list li::before { content: '📄 '; }
    .examples { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
    .example-btn {
      background: #e0f2f1; border: 1px solid #004d40; color: #004d40;
      padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 0.85rem;
    }
    .example-btn:hover { background: #004d40; color: white; }
    .input-area { display: flex; gap: 8px; margin-bottom: 24px; }
    input[type="text"] {
      flex: 1; padding: 10px 14px; border: 2px solid #ddd;
      border-radius: 8px; font-size: 0.95rem;
    }
    input[type="text"]:focus { outline: none; border-color: #004d40; }
    button.send-btn {
      background: #004d40; color: white; border: none;
      padding: 10px 24px; border-radius: 8px; cursor: pointer; font-weight: 600;
    }
    button.send-btn:hover { background: #00251a; }
    button.send-btn:disabled { background: #ccc; cursor: not-allowed; }
    .result { display: none; }
    .tool-log { background: #f8f8f8; border-radius: 8px; padding: 16px; margin-bottom: 16px; }
    .tool-log h3 { font-size: 0.85rem; color: #999; margin-bottom: 8px; }
    .tool-entry { font-family: monospace; font-size: 0.85rem; color: #555; margin-bottom: 4px; }
    .tool-name { color: #004d40; font-weight: 600; }
    .answer-box { background: #e0f2f1; border-left: 4px solid #004d40; padding: 16px; border-radius: 0 8px 8px 0; }
    .answer-box p { white-space: pre-wrap; }
    .loading { color: #999; font-style: italic; }
    .error-msg { color: #dc3545; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header-links">
      <a href="/">← Back to Home</a>
      <a href="https://github.com/RYA234/typescript-container/issues/78" target="_blank">GitHub Source #78</a>
      <a href="https://github.com/RYA234/typescript-container/blob/main/.github/docs/features/agent/11-rag-agent/internal-design.md" target="_blank">内部設計書</a>
      <a href="https://github.com/RYA234/typescript-container/blob/main/.github/docs/features/agent/11-rag-agent/operation-manual.md" target="_blank">運用マニュアル</a>
    </div>

    <h1>RAG + エージェント連携</h1>
    <p class="subtitle">社内ドキュメントをRAG検索し、日時取得・計算と組み合わせて回答します（インメモリ版）</p>

    <div class="docs-list">
      <h3>検索可能なドキュメント</h3>
      <ul>
        <li>project-x.txt — プロジェクトX予算（総額・使用済み）</li>
        <li>hr-policy.txt — 有給休暇・育児休業ポリシー</li>
        <li>work-rules.txt — 就業時間・残業上限</li>
        <li>expense-policy.txt — 交通費支給ルール</li>
      </ul>
    </div>

    <div class="examples">
      <button class="example-btn" onclick="setExample('プロジェクトXの残予算はいくらですか？')">残予算を計算</button>
      <button class="example-btn" onclick="setExample('有給休暇は何日もらえますか？')">有給日数を確認</button>
      <button class="example-btn" onclick="setExample('就業時間と残業上限を教えてください')">就業規則を確認</button>
      <button class="example-btn" onclick="setExample('今日の日付と交通費の上限を教えてください')">日付と交通費</button>
    </div>

    <div class="input-area">
      <input type="text" id="messageInput" placeholder="例：プロジェクトXの残予算はいくらですか？" />
      <button class="send-btn" id="sendBtn" onclick="sendMessage()">質問する</button>
    </div>

    <div class="result" id="result">
      <div class="tool-log" id="toolLog" style="display:none">
        <h3>🔧 ツール呼び出しログ</h3>
        <div id="toolEntries"></div>
      </div>
      <div class="answer-box">
        <p id="answerText"></p>
      </div>
    </div>
  </div>

  <script>
    function setExample(text) {
      document.getElementById('messageInput').value = text;
      document.getElementById('messageInput').focus();
    }
    document.getElementById('messageInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') sendMessage();
    });
    async function sendMessage() {
      const input = document.getElementById('messageInput');
      const message = input.value.trim();
      if (!message) return;
      const sendBtn = document.getElementById('sendBtn');
      const result = document.getElementById('result');
      const answerText = document.getElementById('answerText');
      const toolLog = document.getElementById('toolLog');
      const toolEntries = document.getElementById('toolEntries');
      sendBtn.disabled = true;
      result.style.display = 'block';
      toolLog.style.display = 'none';
      toolEntries.innerHTML = '';
      answerText.textContent = '検索中...';
      answerText.className = 'loading';
      try {
        const res = await fetch('/node/agent/rag/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message }),
        });
        const data = await res.json();
        if (!res.ok) {
          answerText.textContent = data.message || 'エラーが発生しました';
          answerText.className = 'error-msg';
          return;
        }
        if (data.toolCalls && data.toolCalls.length > 0) {
          toolLog.style.display = 'block';
          data.toolCalls.forEach(tool => {
            const entry = document.createElement('div');
            entry.className = 'tool-entry';
            const preview = tool.result.length > 100 ? tool.result.slice(0, 100) + '...' : tool.result;
            entry.innerHTML = `<span class="tool-name">🔧 ${tool.name}</span>(${JSON.stringify(tool.args)}) → ${preview}`;
            toolEntries.appendChild(entry);
          });
        }
        answerText.textContent = data.reply;
        answerText.className = '';
      } catch {
        answerText.textContent = 'ネットワークエラーが発生しました';
        answerText.className = 'error-msg';
      } finally {
        sendBtn.disabled = false;
      }
    }
  </script>
</body>
</html>
