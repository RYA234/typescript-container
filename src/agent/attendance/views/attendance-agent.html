<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>勤怠管理エージェント</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      line-height: 1.6;
      color: #333;
      background: linear-gradient(135deg, #1a237e 0%, #3f51b5 100%);
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      background: white;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
      max-width: 800px;
      margin: 0 auto;
      padding: 40px;
    }
    .header-links { display: flex; gap: 12px; margin-bottom: 24px; flex-wrap: wrap; }
    .header-links a {
      font-size: 0.85rem; color: #1a237e; text-decoration: none;
      padding: 4px 10px; border: 1px solid #1a237e; border-radius: 4px;
    }
    .header-links a:hover { background: #1a237e; color: white; }
    h1 { color: #1a237e; font-size: 2rem; margin-bottom: 8px; }
    .subtitle { color: #666; margin-bottom: 24px; }
    .examples { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
    .example-btn {
      background: #e8eaf6; border: 1px solid #1a237e; color: #1a237e;
      padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 0.85rem;
    }
    .example-btn:hover { background: #1a237e; color: white; }
    .input-area { display: flex; gap: 8px; margin-bottom: 24px; }
    input[type="text"] {
      flex: 1; padding: 10px 14px; border: 2px solid #ddd;
      border-radius: 8px; font-size: 0.95rem;
    }
    input[type="text"]:focus { outline: none; border-color: #1a237e; }
    button.send-btn {
      background: #1a237e; color: white; border: none;
      padding: 10px 24px; border-radius: 8px; cursor: pointer; font-weight: 600;
    }
    button.send-btn:hover { background: #0d1757; }
    button.send-btn:disabled { background: #ccc; cursor: not-allowed; }
    .result { display: none; }
    .tool-log { background: #f8f8f8; border-radius: 8px; padding: 16px; margin-bottom: 16px; }
    .tool-log h3 { font-size: 0.85rem; color: #999; margin-bottom: 8px; }
    .tool-entry { font-family: monospace; font-size: 0.85rem; color: #555; margin-bottom: 4px; }
    .tool-name { color: #1a237e; font-weight: 600; }
    .answer-box { background: #e8eaf6; border-left: 4px solid #1a237e; padding: 16px; border-radius: 0 8px 8px 0; }
    .answer-box p { white-space: pre-wrap; }
    .loading { color: #999; font-style: italic; }
    .error-msg { color: #dc3545; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header-links">
      <a href="/">← Back to Home</a>
      <a href="https://github.com/RYA234/typescript-container/issues/75" target="_blank">GitHub Source #75</a>
      <a href="https://github.com/RYA234/typescript-container/blob/main/.github/docs/features/agent/08-attendance/internal-design.md" target="_blank">内部設計書</a>
      <a href="https://github.com/RYA234/typescript-container/blob/main/.github/docs/features/agent/08-attendance/operation-manual.md" target="_blank">運用マニュアル</a>
    </div>

    <h1>勤怠管理エージェント</h1>
    <p class="subtitle">Gemini Function Calling を使って出勤・退勤記録、勤怠確認、残業時間計算を自動実行します</p>

    <div class="examples">
      <button class="example-btn" onclick="setExample('田中さんの2025-01-15の勤怠を出勤として記録してください')">出勤記録</button>
      <button class="example-btn" onclick="setExample('田中さんの2025-01-15の勤怠を退勤として記録してください')">退勤記録</button>
      <button class="example-btn" onclick="setExample('田中さんの2025年1月の残業時間を教えてください')">田中さんの1月残業時間は？</button>
      <button class="example-btn" onclick="setExample('田中さんの2025-01-06の勤怠を確認してください')">2025-01-06の勤怠を確認</button>
      <button class="example-btn" onclick="setExample('鈴木さんの2025年1月の勤怠一覧を確認してください')">鈴木さんの1月勤怠</button>
    </div>

    <div class="input-area">
      <input type="text" id="messageInput" placeholder="例：田中さんの残業時間を教えてください" />
      <button class="send-btn" id="sendBtn" onclick="sendMessage()">送信</button>
    </div>

    <div class="result" id="result">
      <div class="tool-log" id="toolLog" style="display:none">
        <h3>🔧 ツール呼び出しログ</h3>
        <div id="toolEntries"></div>
      </div>
      <div class="answer-box">
        <p id="answerText"></p>
      </div>
    </div>
  </div>

  <script>
    function setExample(text) {
      document.getElementById('messageInput').value = text;
      document.getElementById('messageInput').focus();
    }
    document.getElementById('messageInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') sendMessage();
    });
    async function sendMessage() {
      const input = document.getElementById('messageInput');
      const message = input.value.trim();
      if (!message) return;
      const sendBtn = document.getElementById('sendBtn');
      const result = document.getElementById('result');
      const answerText = document.getElementById('answerText');
      const toolLog = document.getElementById('toolLog');
      const toolEntries = document.getElementById('toolEntries');
      sendBtn.disabled = true;
      result.style.display = 'block';
      toolLog.style.display = 'none';
      toolEntries.innerHTML = '';
      answerText.textContent = '考え中...';
      answerText.className = 'loading';
      try {
        const res = await fetch('/node/agent/attendance/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message }),
        });
        const data = await res.json();
        if (!res.ok) {
          answerText.textContent = data.message || 'エラーが発生しました';
          answerText.className = 'error-msg';
          return;
        }
        if (data.toolCalls && data.toolCalls.length > 0) {
          toolLog.style.display = 'block';
          data.toolCalls.forEach(tool => {
            const entry = document.createElement('div');
            entry.className = 'tool-entry';
            entry.innerHTML = `<span class="tool-name">🔧 ${tool.name}</span>(${JSON.stringify(tool.args)}) → ${tool.result}`;
            toolEntries.appendChild(entry);
          });
        }
        answerText.textContent = data.reply;
        answerText.className = '';
      } catch {
        answerText.textContent = 'ネットワークエラーが発生しました';
        answerText.className = 'error-msg';
      } finally {
        sendBtn.disabled = false;
      }
    }
  </script>
</body>
</html>
