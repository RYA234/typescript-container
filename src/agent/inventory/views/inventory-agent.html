<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>在庫確認エージェント</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      line-height: 1.6;
      color: #333;
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background: white;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
      max-width: 800px;
      margin: 0 auto;
      padding: 40px;
    }

    .header-links {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }
    .header-links a {
      font-size: 0.85rem;
      color: #f5576c;
      text-decoration: none;
      padding: 4px 10px;
      border: 1px solid #f5576c;
      border-radius: 4px;
    }
    .header-links a:hover { background: #f5576c; color: white; }

    h1 { color: #f5576c; font-size: 2rem; margin-bottom: 8px; }
    .subtitle { color: #666; margin-bottom: 24px; }

    .products-table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 24px;
      font-size: 0.9rem;
    }
    .products-table th {
      background: #f5576c;
      color: white;
      padding: 8px 12px;
      text-align: left;
    }
    .products-table td {
      padding: 8px 12px;
      border-bottom: 1px solid #eee;
    }
    .products-table tr:hover td { background: #fef0f1; }
    .stock-zero { color: #f5576c; font-weight: 600; }

    .examples {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 20px;
    }
    .example-btn {
      background: #fef0f1;
      border: 1px solid #f5576c;
      color: #f5576c;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
    }
    .example-btn:hover { background: #f5576c; color: white; }

    .input-area {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
    }
    input[type="text"] {
      flex: 1;
      padding: 10px 14px;
      border: 2px solid #ddd;
      border-radius: 8px;
      font-size: 0.95rem;
    }
    input[type="text"]:focus { outline: none; border-color: #f5576c; }
    button.send-btn {
      background: #f5576c;
      color: white;
      border: none;
      padding: 10px 24px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
    }
    button.send-btn:hover { background: #e04056; }
    button.send-btn:disabled { background: #ccc; cursor: not-allowed; }

    .result { display: none; }
    .tool-log {
      background: #f8f8f8;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .tool-log h3 { font-size: 0.85rem; color: #999; margin-bottom: 8px; }
    .tool-entry {
      font-family: monospace;
      font-size: 0.85rem;
      color: #555;
      margin-bottom: 4px;
    }
    .tool-name { color: #f5576c; font-weight: 600; }

    .answer-box {
      background: #fef0f1;
      border-left: 4px solid #f5576c;
      padding: 16px;
      border-radius: 0 8px 8px 0;
    }
    .answer-box p { white-space: pre-wrap; }

    .loading { color: #999; font-style: italic; }
    .error-msg { color: #dc3545; }

    .exec-time { font-size: 0.8rem; color: #999; margin-top: 8px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header-links">
      <a href="/">← Back to Home</a>
      <a href="https://github.com/RYA234/typescript-container/issues/69" target="_blank">GitHub Source #69</a>
      <a href="https://github.com/RYA234/typescript-container/blob/main/.github/docs/features/inventory-agent/external-design.md" target="_blank">設計書</a>
    </div>

    <h1>在庫確認エージェント</h1>
    <p class="subtitle">Gemini Function Calling を使って在庫・価格・合計金額を自然言語で確認できます</p>

    <table class="products-table">
      <thead>
        <tr><th>商品名</th><th>在庫数</th><th>単価</th></tr>
      </thead>
      <tbody>
        <tr><td>商品A</td><td>120個</td><td>1,500円</td></tr>
        <tr><td>商品B</td><td>45個</td><td>3,200円</td></tr>
        <tr><td>商品C</td><td class="stock-zero">0個（在庫なし）</td><td>800円</td></tr>
        <tr><td>商品D</td><td>200個</td><td>5,000円</td></tr>
      </tbody>
    </table>

    <div class="examples">
      <button class="example-btn" onclick="setExample('商品Aの在庫は何個ありますか？')">商品Aの在庫は？</button>
      <button class="example-btn" onclick="setExample('商品Bの単価を教えてください')">商品Bの単価は？</button>
      <button class="example-btn" onclick="setExample('商品Aを10個買ったらいくらですか？')">商品Aを10個買ったら？</button>
      <button class="example-btn" onclick="setExample('商品Cを5個買ったらいくら？在庫も教えて')">商品Cの在庫と金額</button>
      <button class="example-btn" onclick="setExample('商品Zはありますか？')">存在しない商品</button>
    </div>

    <div class="input-area">
      <input type="text" id="messageInput" placeholder="質問を入力してください..." />
      <button class="send-btn" id="sendBtn" onclick="sendMessage()">送信</button>
    </div>

    <div class="result" id="result">
      <div class="tool-log" id="toolLog" style="display:none">
        <h3>🔧 ツール呼び出しログ</h3>
        <div id="toolEntries"></div>
      </div>
      <div class="answer-box">
        <p id="answerText"></p>
        <p class="exec-time" id="execTime"></p>
      </div>
    </div>
  </div>

  <script>
    function setExample(text) {
      document.getElementById('messageInput').value = text;
      document.getElementById('messageInput').focus();
    }

    document.getElementById('messageInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') sendMessage();
    });

    async function sendMessage() {
      const input = document.getElementById('messageInput');
      const message = input.value.trim();
      if (!message) return;

      const sendBtn = document.getElementById('sendBtn');
      const result = document.getElementById('result');
      const answerText = document.getElementById('answerText');
      const toolLog = document.getElementById('toolLog');
      const toolEntries = document.getElementById('toolEntries');
      const execTime = document.getElementById('execTime');

      sendBtn.disabled = true;
      result.style.display = 'block';
      toolLog.style.display = 'none';
      toolEntries.innerHTML = '';
      answerText.textContent = '考え中...';
      answerText.className = 'loading';
      execTime.textContent = '';

      try {
        const res = await fetch('/node/agent/inventory/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message }),
        });

        const data = await res.json();

        if (!res.ok) {
          answerText.textContent = data.message || 'エラーが発生しました';
          answerText.className = 'error-msg';
          return;
        }

        if (data.toolsUsed && data.toolsUsed.length > 0) {
          toolLog.style.display = 'block';
          data.toolsUsed.forEach(tool => {
            const entry = document.createElement('div');
            entry.className = 'tool-entry';
            entry.innerHTML = `<span class="tool-name">🔧 ${tool.name}</span>(${JSON.stringify(tool.input)}) → ${JSON.stringify(tool.output)}`;
            toolEntries.appendChild(entry);
          });
        }

        answerText.textContent = data.answer;
        answerText.className = '';
        execTime.textContent = `実行時間: ${data.executionTimeMs}ms`;
      } catch {
        answerText.textContent = 'ネットワークエラーが発生しました';
        answerText.className = 'error-msg';
      } finally {
        sendBtn.disabled = false;
      }
    }
  </script>
</body>
</html>
