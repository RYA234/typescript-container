name: 🐛 Bug Report
description: Report a bug or unexpected behavior
title: "[BUG] "
labels: ["bug", "priority:high"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting this bug! Please provide as much detail as possible.
        
  - type: dropdown
    id: category
    attributes:
      label: Category
      description: Which component is affected?
      options:
        - RAG Feature
        - UX Feature
        - Chatbot
        - Sample Features
        - Infrastructure
        - CI/CD
        - Other
    validations:
      required: true
      
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      description: How severe is this bug?
      options:
        - Critical (Production down)
        - High (Major functionality broken)
        - Medium (Feature partially broken)
        - Low (Minor issue)
    validations:
      required: true
      
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: Clear description of the bug
    validations:
      required: true
      
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true
      
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true
      
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
    validations:
      required: true
      
  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: |
        - OS: Windows 11
        - Browser: Chrome 120
        - Node.js: 18.x
        - Environment: Production / Local
    validations:
      required: true
